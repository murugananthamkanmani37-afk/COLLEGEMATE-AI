<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CollegeMate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2f5fb;
      --grid: #d9e1f0;
      --card: #ffffff;
      --ink: #14213d;
      --ink-soft: #5a6785;
      --line: #c5d0e6;
      --blue: #2b4fd8;
      --highlighter: #ffe45e;
      --highlighter-ink: #3b3200;
      --danger: #b3261e;
      --ui-font: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --read-font: "Literata", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--ui-font);
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 28px 28px;
      display: flex;
      justify-content: center;
    }

    .desk {
      width: 100%;
      max-width: 820px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      gap: 12px;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .logo {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--highlighter);
      border: 2px solid var(--ink);
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      transform: rotate(-4deg);
    }

    .masthead h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
    .masthead p { font-size: 0.85rem; color: var(--ink-soft); }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .status i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22a06b;
    }

    .board {
      position: relative;
      flex: 1;
      min-height: 0;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(3px);
      border: 2px solid var(--ink);
      border-radius: 14px;
      overflow: hidden;
    }

    .messages {
      height: 100%;
      overflow-y: auto;
      padding: 22px 18px 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

    .msg { display: flex; max-width: 86%; animation: pop 0.22s ease-out; }
    .msg.user { align-self: flex-end; }
    .msg.bot { align-self: flex-start; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .bubble { font-size: 1rem; line-height: 1.6; word-wrap: break-word; overflow-wrap: anywhere; }

    .user .bubble {
      background: var(--highlighter);
      color: var(--highlighter-ink);
      padding: 10px 15px;
      border: 2px solid var(--ink);
      border-radius: 14px 14px 3px 14px;
      font-weight: 500;
      box-shadow: 3px 3px 0 var(--ink);
      white-space: pre-wrap;
    }

    .bot .bubble {
      background: var(--card);
      font-family: var(--read-font);
      padding: 12px 16px 12px 18px;
      border: 2px solid var(--ink);
      border-left: 7px solid var(--blue);
      border-radius: 3px 14px 14px 14px;
      line-height: 1.7;
    }

    .bubble p + p, .bubble p + ul, .bubble p + ol,
    .bubble ul + p, .bubble ol + p, .bubble pre + p, .bubble p + pre { margin-top: 0.7em; }

    .bubble ul, .bubble ol { padding-left: 1.3em; }
    .bubble li + li { margin-top: 0.25em; }
    .bubble strong { font-weight: 600; }

    .bubble code {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 0.88em;
      background: #e8edf9;
      padding: 1px 5px;
      border-radius: 5px;
    }

    .bubble pre {
      background: var(--ink);
      color: #eaf0ff;
      padding: 12px 14px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .bubble pre code { background: none; padding: 0; color: inherit; }

    .msg.error .bubble { border-left-color: var(--danger); color: var(--danger); }

    .typing { display: flex; gap: 5px; padding: 6px 2px; }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      animation: bounce 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      font-family: var(--ui-font);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink);
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .chip:hover { background: var(--highlighter); transform: translateY(-2px); }

    .to-latest {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translate(-50%, 12px);
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--ui-font);
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      background: var(--blue);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 8px 16px 8px 12px;
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .to-latest.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .to-latest svg { width: 18px; height: 18px; }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .composer textarea {
      flex: 1;
      resize: none;
      max-height: 140px;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--ui-font);
      font-size: 1rem;
      line-height: 1.5;
      color: var(--ink);
      padding: 8px 6px;
    }

    .composer textarea::placeholder { color: var(--ink-soft); }

    .send {
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: var(--highlighter-ink);
      background: var(--highlighter);
      border: 2px solid var(--ink);
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.12s;
    }

    .send:hover:not(:disabled) { transform: rotate(-6deg) scale(1.05); }
    .send:disabled { opacity: 0.45; cursor: not-allowed; }
    .send svg { width: 22px; height: 22px; }

    button:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    .composer:focus-within { border-color: var(--blue); }

    @media (max-width: 520px) {
      .desk { padding: 10px; gap: 10px; }
      .masthead p, .status span { display: none; }
      .msg { max-width: 94%; }
      .messages { padding: 16px 12px 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="desk">
    <header class="masthead">
      <div class="logo" aria-hidden="true">CM</div>
      <div>
        <h1>CollegeMate AI</h1>
        <p>Your study partner for every subject</p>
      </div>
      <div class="status"><i></i><span>Ready to help</span></div>
    </header>

    <section class="board">
      <div class="messages" id="messages" aria-live="polite"></div>
      <button class="to-latest" id="toLatest" type="button" aria-label="Scroll to latest message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
        Latest
      </button>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a study question..." aria-label="Your message"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>
  </main>

  <script>
    const WELCOME = {{ welcome|tojson }};
    const SUGGESTIONS = [
      "Explain photosynthesis simply",
      "Make a 7-day exam study plan",
      "How do I write a strong essay intro?",
      "Solve 2x + 6 = 14 step by step"
    ];

    const messagesEl = document.getElementById("messages");
    const toLatestBtn = document.getElementById("toLatest");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const history = [];
    let waiting = false;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function formatBlock(text) {
      const lines = escapeHtml(text).split("\n");
      let html = "";
      let listType = null;

      const closeList = () => {
        if (listType) {
          html += "</" + listType + ">";
          listType = null;
        }
      };

      lines.forEach((line) => {
        const bullet = line.match(/^\s*[-*]\s+(.*)/);
        const numbered = line.match(/^\s*\d+[.)]\s+(.*)/);
        const heading = line.match(/^#{1,6}\s+(.*)/);

        if (bullet || numbered) {
          const type = bullet ? "ul" : "ol";
          if (listType !== type) {
            closeList();
            html += "<" + type + ">";
            listType = type;
          }
          html += "<li>" + formatInline((bullet || numbered)[1]) + "</li>";
        } else if (line.trim()) {
          closeList();
          const content = heading ? "<strong>" + formatInline(heading[1]) + "</strong>" : formatInline(line);
          html += "<p>" + content + "</p>";
        } else {
          closeList();
        }
      });

      closeList();
      return html;
    }

    function formatMessage(raw) {
      return raw
        .split(/```(?:\w+)?\n?([\s\S]*?)```/g)
        .map((part, i) => (i % 2 ? "<pre><code>" + escapeHtml(part.trim()) + "</code></pre>" : formatBlock(part)))
        .join("");
    }

    function isNearBottom() {
      const gap = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
      return gap < 120;
    }

    function scrollToLatest(smooth = true) {
      messagesEl.scrollTo({
        top: messagesEl.scrollHeight,
        behavior: smooth ? "smooth" : "auto"
      });
    }

    function updateScrollButton() {
      toLatestBtn.classList.toggle("show", !isNearBottom());
    }

    function addMessage(role, text, extraClass = "") {
      const wrapper = document.createElement("div");
      wrapper.className = "msg " + role + " " + extraClass;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "bot" && !extraClass) {
        bubble.innerHTML = formatMessage(text);
      } else {
        bubble.textContent = text;
      }

      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      scrollToLatest();
      return wrapper;
    }

    function addTyping() {
      const wrapper = document.createElement("div");
      wrapper.className = "msg bot";
      wrapper.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      messagesEl.appendChild(wrapper);
      scrollToLatest();
      return wrapper;
    }

    function addSuggestions() {
      const chips = document.createElement("div");
      chips.className = "chips";
      chips.id = "chips";

      SUGGESTIONS.forEach((text) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = text;
        chip.addEventListener("click", () => sendMessage(text));
        chips.appendChild(chip);
      });

      messagesEl.appendChild(chips);
    }

    function setWaiting(state) {
      waiting = state;
      sendBtn.disabled = state;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || waiting) return;

      const chips = document.getElementById("chips");
      if (chips) chips.remove();

      addMessage("user", message);
      history.push({ role: "user", text: message });

      input.value = "";
      resizeInput();
      setWaiting(true);

      const typing = addTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage("bot", data.error || "Something went wrong. Please try again.", "error");
          history.pop();
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "bot", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("bot", "Can't reach the server. Check your connection and try again.", "error");
        history.pop();
      } finally {
        setWaiting(false);
        input.focus();
      }
    }

    messagesEl.addEventListener("scroll", updateScrollButton);
    toLatestBtn.addEventListener("click", () => scrollToLatest());

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(input.value);
      }
    });

    addMessage("bot", WELCOME);
    addSuggestions();
    input.focus();
  </script>
</body>
</html>
